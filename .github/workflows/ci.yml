# Cổng kiểm mỗi PR và mỗi lần vào main: lint, test (Linux offscreen + Windows thật),
# soát lỗ hổng phụ thuộc, quét lộ bí mật. Action ghim SHA (SECURITY_BASELINE mục 5).
# CodeQL dùng "default setup" của org - KHÔNG thêm workflow CodeQL riêng (GitHub sẽ từ chối SARIF).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-linux:
    name: Lint + test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      # Thư viện hệ thống Qt cần khi chạy offscreen.
      - name: Thư viện Qt
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Cài phụ thuộc đã khóa (--require-hashes)
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Soát lỗ hổng phụ thuộc (pip-audit)
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements.txt -r requirements-dev.txt

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Cài phụ thuộc đã khóa (--require-hashes)
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests

  secrets:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Binary ghim phiên bản + checksum - gitleaks-action đòi license khi repo thuộc Organization.
      # Nâng phiên bản: đổi CẢ HAI dòng, checksum lấy từ gitleaks_<ver>_checksums.txt chính thức.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tải gitleaks (ghim phiên bản, kiểm checksum)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Quét toàn lịch sử git
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --ignore-gitleaks-allow --no-banner --exit-code 1 .
