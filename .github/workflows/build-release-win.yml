# Đẩy tag `v<APP_VERSION>` -> build .exe trên Windows, sinh SBOM, ký chứng thực nguồn gốc bản build
# (SLSA build provenance, miễn phí với repo public), đính .exe + SBOM + SHA256SUMS vào Release.
# Người tải kiểm: gh attestation verify <file>.exe --repo tsudev-org/tsudev-contact
name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write        # tạo/đính file vào Release
      id-token: write        # chứng thực nguồn gốc (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Cài phụ thuộc đã khóa (--require-hashes)
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Chạy test (lõi + giao diện)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests

      # Chỉ đối chiếu khi chạy theo tag; chạy tay từ tab Actions thì ref_name là tên nhánh.
      - name: Đối chiếu tag với APP_VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $appVersion = python -c "from src.app_info import APP_VERSION; print(APP_VERSION)"
          $tagVersion = $env:TAG -replace '^v', ''
          if ($tagVersion -ne $appVersion) {
            throw "Tag '$tagVersion' khác APP_VERSION '$appVersion' - sửa src/app_info.py hoặc đặt lại tag."
          }

      - name: Đóng gói (exe + SBOM + SHA256SUMS)
        shell: pwsh
        run: .\scripts\build-win.ps1 -SkipDeps -SkipTests

      - name: Chứng thực nguồn gốc bản build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release/*.exe'

      - name: Lưu sản phẩm build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsudev-contact-windows
          path: release/*

      - name: Đính vào Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload $env:TAG (Get-ChildItem release\* | ForEach-Object FullName) --clobber
