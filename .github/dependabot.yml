# Đề xuất PR nâng phụ thuộc mỗi tháng, gom theo hệ sinh thái. Sau khi Dependabot nâng requirements*.txt
# vẫn phải chạy scripts/lock-deps.sh nếu đổi requirements*.in.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
